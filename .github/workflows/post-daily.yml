name: Post to Instagram

on:
  schedule:
    # 02:30 UTC daily = 7:30pm Pacific (PDT, UTC-7). Shifts to 6:30pm once
    # PST (UTC-8) kicks in Nov; edit the hour then if you want it pinned to
    # 7:30pm year-round. Chosen for evening engagement on car content.
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: instagram-posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Post next queued item
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/post_to_instagram.py

      - name: Commit queue update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/queue.json
          git diff --cached --quiet && exit 0
          git commit -m "Mark queued post as published [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
